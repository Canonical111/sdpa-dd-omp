name: build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        openmp: ["yes", "no"]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential autoconf automake libtool
      - name: generate configure (upstream ships only configure.ac)
        run: autoreconf -fi
      - name: configure
        run: ./configure --enable-openmp=${{ matrix.openmp }}
      # 2026-08-05: these two steps used to be `make || true` followed by a sed that
      # uncommented CC inside SPOOLES's extracted Make.inc. The shipped patch left every CC
      # assignment commented out, and SPOOLES's `.POSIX:` makes GNU make default CC to c99,
      # which rejects -funroll-all-loops -- so `make` could never build this tree unaided and
      # the only working recipe lived HERE, in CI, and in the install skill, in three
      # divergent versions. It now lives in the tree: external/spooles/patches/patch-Make.inc
      # carries the flags (including the -Wno-error= set GCC 14+ needs) and
      # external/spooles/Makefile.am puts CC on the SPOOLES make line. A plain make must
      # therefore work. If this step fails, that fix has regressed -- do not paper over it
      # with a sed again, fix the patch.
      - name: make -- the shipped recipe must build SPOOLES unaided
        run: make -j"$(nproc)"
      - name: SPOOLES really received the patched flags
        run: |
          L=external/spooles/work/spooles-build.log
          [ -s "$L" ] || { echo "FAIL: no SPOOLES build log at $L" >&2; exit 1; }
          grep -q -- '-funroll-all-loops'        "$L" || { echo "FAIL: patched CFLAGS absent from the SPOOLES compile lines" >&2; exit 1; }
          grep -q -- '-Wno-error=int-conversion' "$L" || { echo "FAIL: GCC-14 rescue flags absent" >&2; exit 1; }
          echo "$(grep -c -- '-Wno-error=int-conversion' "$L") SPOOLES compile lines carry the rescue flags"
      - name: OpenMP linkage matches the matrix
        run: |
          n=$(ldd sdpa_dd | grep -c gomp || true)
          [ "${{ matrix.openmp }}" = yes ] && [ "$n" -ge 1 ] || { [ "${{ matrix.openmp }}" = no ] && [ "$n" -eq 0 ]; }
      - name: solve the bundled example
        run: |
          ./sdpa_dd -ds example1.dat-s -o out.result -p param.sdpa
          grep objValPrimal out.result
      - name: accept long high-precision decimal tokens
        run: |
          awk 'NR <= 5 { print; next } { v=$5; if (v !~ /\./) v=v "."; for (i=0;i<600;i++) v=v "0"; print $1,$2,$3,$4,v }' example1.dat-s > long-decimal.dat-s
          ./sdpa_dd -ds long-decimal.dat-s -o long-decimal.result -p param.sdpa
          grep -q 'phase.value = pdOPT' long-decimal.result
          ! grep -qi nan long-decimal.result
      - name: fatal errors must exit non-zero
        run: |
          set -u
          fail() { echo "FAIL: $1" >&2; exit 1; }
          run_rc() { set +e; "$@" >/dev/null 2>&1; echo $?; set -e; }
          # (a) nonexistent data file
          rc=$(run_rc ./sdpa_dd -ds no_such_file.dat-s -o /tmp/x.out -p param.sdpa)
          [ "$rc" -ne 0 ] || fail "missing data file returned 0"
          # (b) unwritable output path
          rc=$(run_rc ./sdpa_dd -ds example1.dat-s -o /nonexistent_dir/x.out -p param.sdpa)
          [ "$rc" -ne 0 ] || fail "unwritable output returned 0"
          # (c) missing parameter file
          rc=$(run_rc ./sdpa_dd -ds example1.dat-s -o /tmp/x.out -p no_such_param.sdpa)
          [ "$rc" -ne 0 ] || fail "missing parameter file returned 0"
          # (d) a successful solve must still be 0
          rc=$(run_rc ./sdpa_dd -ds example1.dat-s -o /tmp/ok.out -p param.sdpa)
          [ "$rc" -eq 0 ] || fail "successful solve returned $rc"
      - name: malformed input is rejected, never silently solved
        run: |
          set -u
          fail() { echo "FAIL: $1" >&2; exit 1; }
          run_rc() { set +e; "$@" >/dev/null 2>&1; echo $?; set -e; }
          # negative entry index: used to write out of bounds and print a full solution
          # Line 5 is the b-vector ("48, -8, 20"); the FIRST SPARSE RECORD is line 6.
          # Mutating line 5 made these cases fail for unrelated parse errors, so they were
          # green while testing nothing they claim. Print the line so a future move is visible.
          echo "fixture target line 6: $(sed -n 6p example1.dat-s)"
          awk 'NR==6 {print "1 1 -3 -3 1.0"; next} {print}' example1.dat-s > neg-index.dat-s
          rc=$(run_rc ./sdpa_dd -ds neg-index.dat-s -o /tmp/neg.out -p param.sdpa)
          [ "$rc" -ne 0 ] || fail "negative index accepted (rc=0)"
          [ "$rc" -lt 128 ] || fail "negative index killed by signal (rc=$rc), not diagnosed"
          ./sdpa_dd -ds neg-index.dat-s -o /tmp/neg.out -p param.sdpa 2>neg.err || true
          grep -qiE 'out of range|index' neg.err \
            || fail "negative index rejected, but not for the reason claimed: $(head -1 neg.err)"
          # positive control: the SAME file unmutated must still solve, so a fixture that
          # breaks the file some other way cannot masquerade as a bounds test.
          rc=$(run_rc ./sdpa_dd -ds example1.dat-s -o /tmp/pc.out -p param.sdpa)
          [ "$rc" -eq 0 ] || fail "positive control failed (rc=$rc): the fixture base file is broken"
          grep -q objValPrimal /tmp/neg.out 2>/dev/null && fail "negative index produced a solution"
          # block index out of range
          awk 'NR==6 {print "1 99 1 1 1.0"; next} {print}' example1.dat-s > bad-block.dat-s
          # six fields on one record: extra token must be rejected AT ITS LINE,
          # not diagnosed as a truncation four records later (review2 finding on
          # the earlier wrong-diagnostic behaviour)
          awk 'NR==6 {print "0 1 1 1 -11 99"; next} {print}' example1.dat-s > six-field.dat-s
          rc=0; ./sdpa_dd -ds six-field.dat-s -o /tmp/sf.out -p param.sdpa 2>sf.err || rc=$?
          [ "$rc" -eq 1 ] || fail "six-field record: rc=$rc, want 1"
          grep -q 'line 6' sf.err || fail "six-field record not diagnosed at line 6: $(head -1 sf.err)"
          # zero and negative header dimensions must be clean rejections, not
          # bad_array_new_length aborts (review2 dimension hardening)
          for dim in 0 -3; do
            awk -v d=$dim 'NR==1 {print d; next} {print}' example1.dat-s > bad-m.dat-s
            rc=0; ./sdpa_dd -ds bad-m.dat-s -o /tmp/bm.out -p param.sdpa 2>bm.err || rc=$?
            [ "$rc" -eq 1 ] || fail "m=$dim: rc=$rc, want 1 (clean rejection)"
          done
          rc=$(run_rc ./sdpa_dd -ds bad-block.dat-s -o /tmp/bb.out -p param.sdpa)
          [ "$rc" -ne 0 ] || fail "out-of-range block index accepted (rc=0)"
          [ "$rc" -lt 128 ] || fail "bad block index killed by signal (rc=$rc), not diagnosed"
          # comment-only file: used to loop forever writing output
          printf '*comment only\n' > cmt.dat-s
          set +e; timeout 20 ./sdpa_dd -ds cmt.dat-s -o /tmp/cmt.out -p param.sdpa >/dev/null 2>&1; rc=$?; set -e
          [ "$rc" -ne 124 ] || fail "comment-only file still hangs (timed out)"
          [ "$rc" -ne 0 ] || fail "comment-only file returned 0"
          # truncated file
          head -3 example1.dat-s > trunc.dat-s
          rc=$(run_rc ./sdpa_dd -ds trunc.dat-s -o /tmp/tr.out -p param.sdpa)
          [ "$rc" -ne 0 ] || fail "truncated file returned 0"
          [ "$rc" -lt 128 ] || fail "truncated file killed by signal (rc=$rc), not diagnosed"

      - name: dimension edges -- big negative LP block, oversized products, mDIM=INT_MAX (review2 §8)
        run: |
          set -u
          # (a) a -50000 diagonal/LP block has linear storage and must NOT be
          # rejected by the SDP square-size limit (validated on all three forks:
          # solves to a phase, rc=0)
          printf '1\n1\n-50000\n1.0\n0 1 1 1 1.0\n1 1 1 1 1.0\n' > bigneg.dat-s
          rc=0; timeout 300 ./sdpa_dd -ds bigneg.dat-s -o /tmp/bn.out -p param.sdpa >/dev/null 2>bn.err || rc=$?
          [ "$rc" -eq 0 ] || { echo "FAIL: -50000 LP block rc=$rc" >&2; cat bn.err >&2; exit 1; }
          grep -q 'phase.value' /tmp/bn.out || { echo "FAIL: no phase printed" >&2; exit 1; }
          # (b) m * SDP_nBlock past INT_MAX must die at the checked product with
          # a diagnostic, never overflow into a negative allocation. Size-2
          # blocks, deliberately: size-1 blocks are stored as LP and leave
          # SDP_nBlock = 0.
          python3 -c 'm,nb=4300,500000; f=open("ovf.dat-s","w"); f.write("%d\n%d\n"%(m,nb)); f.write(" ".join(["2"]*nb)+"\n"); f.write(" ".join(["1.0"]*m)+"\n"); f.write("0 1 1 1 1.0\n1 1 1 1 1.0\n")'
          rc=0; timeout 300 ./sdpa_dd -ds ovf.dat-s -o /tmp/ov.out -p param.sdpa >/dev/null 2>ov.err || rc=$?
          [ "$rc" -eq 1 ] || { echo "FAIL: oversized product rc=$rc, want 1" >&2; head -2 ov.err >&2; exit 1; }
          grep -q 'allocation size overflow' ov.err || { echo "FAIL: wrong rejection reason: $(head -1 ov.err)" >&2; exit 1; }
          # (c) mDIM = INT_MAX is rejected up front: downstream code allocates m+1
          printf '2147483647\n1\n2\n1.0\n0 1 1 1 1.0\n' > intmax.dat-s
          rc=0; ./sdpa_dd -ds intmax.dat-s -o /tmp/im.out -p param.sdpa >/dev/null 2>im.err || rc=$?
          [ "$rc" -eq 1 ] || { echo "FAIL: mDIM=INT_MAX rc=$rc, want 1" >&2; exit 1; }
          grep -q 'not representable once incremented' im.err || { echo "FAIL: wrong diagnostic: $(head -1 im.err)" >&2; exit 1; }
          echo "-50000 LP block solves; 4300*500000 dies at the checked product; mDIM=INT_MAX rejected"
      - name: every changed source file carries a dated, correctly-licensed notice
        run: |
          set -e
          # PUBLISHING.md and this fork's README claim this universally; it was
          # untrue until it was checked. The checker is shared with the recipe
          # repository (patches/check_notices.sh) and self-tests itself, so a
          # marker-only or fail-open regression in the checker fails the job too.
          git fetch --unshallow 2>/dev/null || true
          bash .github/check_notices.sh --self-test
          bash .github/check_notices.sh .
      - name: interleaved LP/SDP initial point, dense vs sparse (review2 finding 2)
        run: |
          set -e
          cd tests/initpoint_interleaved
          ../../sdpa_dd -ds prob.dat-s -is init_sparse.ini-s -o /tmp/ip_s.out -p ../../param.sdpa > /dev/null
          ../../sdpa_dd -ds prob.dat-s -id init_dense.ini   -o /tmp/ip_d.out -p ../../param.sdpa > /dev/null
          # Compare the COMPLETE printed solution section, not a scalar
          # shortlist (review2 §8: the offline check that proved this fix
          # compared full solutions; CI keeps the stronger form).
          sel() { grep -E 'objValPrimal|objValDual|phase\.value|Iteration =' "$1" || true
                  awk '/^xVec *=/{f=1} f && !/time *=/' "$1"; }
          sel /tmp/ip_s.out > /tmp/ip_s.sel
          sel /tmp/ip_d.out > /tmp/ip_d.sel
          test -s /tmp/ip_s.sel && test -s /tmp/ip_d.sel
          grep -q '{' /tmp/ip_s.sel || { echo "FAIL: no solution rows captured" >&2; exit 1; }
          diff /tmp/ip_s.sel /tmp/ip_d.sel \
            || { echo "FAIL: dense and sparse spellings of the same initial point diverged" >&2; exit 1; }
          echo "dense == sparse over the complete solution section ($(wc -l < /tmp/ip_s.sel) lines)"
      - name: failed X/Z update rolls back to a PARTIAL result (review2 finding 1)
        run: |
          set -e
          # control1 driven past dd precision breaks the updated-X/Z Cholesky at
          # iteration 71, deterministically. History of this exact case: upstream
          # printed the CORRUPTED point and exited 0; the first fix suppressed
          # everything (exit 2, no solution) -- which threw away a valid point,
          # and at this fork's DEFAULT parameters real SDPLIB problems end here;
          # the final policy rolls the step back and reports the last valid
          # iterate as PARTIAL, exit 3.
          sed -E 's/^1.0E-30/1.0E-40/' param.sdpa > /tmp/hard.sdpa
          rc=0; ./sdpa_dd -ds tests/control1.dat-s -o /tmp/hard.out -p /tmp/hard.sdpa > /dev/null 2>/tmp/hard.err || rc=$?
          [ "$rc" -eq 3 ] || { echo "FAIL: expected rc=3 (partial), got $rc" >&2; cat /tmp/hard.err >&2; exit 1; }
          grep -q 'solveStatus = PARTIAL' /tmp/hard.out || { echo "FAIL: no machine-readable PARTIAL status" >&2; exit 1; }
          grep -q '^xVec' /tmp/hard.out || { echo "FAIL: the rolled-back valid iterate was not printed" >&2; exit 1; }
          # This fork's iteration number IS pinned -- verified portable on x86
          # Actions as well as arm64. (qd's is not, and says so where it lives:
          # quad-double trajectories move across architectures.) The internal
          # invariant is asserted alongside it, so a future output-format change
          # cannot satisfy the grep while meaning something else.
          fi=$(sed -n 's/^failureIteration = *//p' /tmp/hard.out | head -1)
          it=$(sed -n 's/^ *Iteration = *//p' /tmp/hard.out | head -1)
          echo "observed: failureIteration=$fi, reported Iteration=$it"
          [ "$fi" = "71" ] || { echo "FAIL: failureIteration $fi, expected 71" >&2; exit 1; }
          [ "$fi" = "$it" ] || { echo "FAIL: failureIteration $fi != reported Iteration $it" >&2; exit 1; }
          # Positive control: a problem that genuinely solves must still exit 0
          # with no PARTIAL marker. NOT control1 -- at this fork's DEFAULT
          # parameters control1 itself ends PARTIAL (that is the very case the
          # regression sweep surfaced), so it cannot serve as the success case.
          rc=0; ./sdpa_dd -ds example1.dat-s -o /tmp/ok.out -p param.sdpa > /dev/null || rc=$?
          [ "$rc" -eq 0 ] || { echo "FAIL: positive control rc=$rc, expected 0" >&2; exit 1; }
          grep -q '^xVec' /tmp/ok.out
          if grep -q 'solveStatus' /tmp/ok.out; then echo "FAIL: success run carries a solveStatus marker" >&2; exit 1; fi
          echo "positive control: rc=0, solution printed, no failure markers"
      - name: 1-thread and 8-thread results are identical (determinism guarantee)
        if: matrix.openmp == 'yes'
        run: |
          set -euo pipefail
          OMP_NUM_THREADS=1 ./sdpa_dd -ds example1.dat-s -o t1.out -p param.sdpa >/dev/null
          OMP_NUM_THREADS=8 ./sdpa_dd -ds example1.dat-s -o t8.out -p param.sdpa >/dev/null
          # Select the solution-bearing content rather than excluding timing lines: an
          # exclusion list has to know every timer format the solver can print and rots
          # silently when one is added. Two parts: the scalar convergence fields, and the
          # WHOLE final solution section from "xVec =" onward -- matrix continuation rows
          # are indented, so a "^{" pattern would compare only each block's first row.
          # The timing block follows the matrices, hence the time= drop.
          sel() {
            grep -E 'objValPrimal|objValDual|phase\.value|Iteration =|relative gap|feas\.error' "$1" || true
            awk '/^xVec *=/{f=1} f && !/time *=/' "$1"
          }
          # Write to regular files: `test -s <(...)` is always false, because process
          # substitution exposes a pipe and a pipe reports size zero.
          sel t1.out > t1.selected
          sel t8.out > t8.selected
          test -s t1.selected || { echo "FAIL: selector matched nothing" >&2; exit 1; }
          grep -q '^  *{' t1.selected || { echo "FAIL: no indented matrix rows captured" >&2; exit 1; }
          diff -u t1.selected t8.selected || { echo "FAIL: 1 vs 8 threads differ" >&2; exit 1; }
          # Positive control: perturbing an indented continuation row MUST be detected.
          # (awk, not `sed '0,/re/'` -- that range form is a GNU extension and is a silent
          # no-op under BSD sed, which would make this control vacuous on some runners.)
          awk 'BEGIN{done=0} /^[[:space:]]+\{/ && !done {print "  {9.99e+99"; done=1; next} {print}' \
            t1.selected > t1.mutated
          if diff -q t1.selected t1.mutated >/dev/null; then
            echo "FAIL: positive control did not mutate anything -- the check is vacuous" >&2; exit 1
          fi
          if diff -q t1.mutated t8.selected >/dev/null; then
            echo "FAIL: comparison cannot detect a changed matrix row" >&2; exit 1
          fi
      - name: kernel accumulation-form invariant
        # Rpotrf's lower path is bit-identical to its serial self only while three separate
        # things hold, and every one of them fails SILENTLY: Rgemm_NT_omp must keep the
        # "C += temp*A" accumulation form rather than netlib's TEMP-from-zero form (that kernel
        # has already been edited once by this fork); Rsyrk_omp must split output columns and
        # never the k reduction; and Rtrsm_omp must split its Right case over ROWS, not columns.
        # tests/kernel_form_invariant.cpp pins all three, with a positive control on the first.
        # It links the built mplapack objects directly -- no second compile of the kernels, so
        # it cannot pass against a stale or differently-flagged copy of them.
        run: |
          set -euo pipefail
          OMPFLAG=""
          if [ "${{ matrix.openmp }}" = yes ]; then OMPFLAG="-fopenmp"; fi
          ls mplapack/sdpa_dd-Rsyrk_omp.o mplapack/sdpa_dd-Rtrsm_omp.o >/dev/null \
            || { echo "FAIL: the kernels under test were not built" >&2; exit 1; }
          g++ -O2 $OMPFLAG -I mplapack -I external/i/QD/include \
            -o kernel_form_invariant tests/kernel_form_invariant.cpp \
            mplapack/sdpa_dd-*.o -L external/i/QD/lib -lqd -lm
          OMP_NUM_THREADS=4 ./kernel_form_invariant
# Job C -- -ftrivial-auto-var-init=zero vs =pattern must give identical output.
# This is the method that found the iMlaenv block-size bug. ASan cannot see an
# in-bounds uninitialised stack read; this can.
# Verified 2026-08-04 on pi (gcc 13.3.0) on all three forks at their dev tips.
  auto-var-init:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential autoconf automake libtool
      - name: compiler must support the flag at all
        run: |
          printf 'int main(){return 0;}\n' > /tmp/a.c
          gcc -ftrivial-auto-var-init=pattern -c /tmp/a.c -o /tmp/a.o \
            || { echo "FAIL: toolchain lacks -ftrivial-auto-var-init (needs GCC >= 12)" >&2; exit 1; }

      - name: build twice, zero and pattern
        run: |
          set -e
          build() {   # $1 = zero|pattern, $2 = destination dir
            rm -rf "$2"; mkdir -p "$2"; tar -c --exclude=.git --exclude="$2" . | tar -x -C "$2"
            ( cd "$2"
              autoreconf -fi >/dev/null 2>&1 || true          # dd / gmp
              ./configure --enable-openmp=yes >/dev/null      # qd: --with-qd-includedir=... --with-qd-libdir=...
              F="-O2 -funroll-all-loops -ftrivial-auto-var-init=$1"
              make -j"$(nproc)" CXXFLAGS="$F" CFLAGS="$F" > build.log 2>&1 || true
              MK=$(find . -path '*spooles*' -name Make.inc | head -1)
              if [ -n "$MK" ] && [ ! -x ./sdpa_dd ]; then
                sed -i 's|^# CC = gcc|  CC = gcc|' "$MK"; d=$(dirname "$MK")
                ( cd "$d" && find . -name '*.o' -delete && rm -f spooles.a && make global -f makefile >/dev/null 2>&1 \
                  && { cp spooles.a ../../../i/SPOOLES/lib/libspooles.a 2>/dev/null || cp spooles.a ./libspooles.a; } )
                make -j"$(nproc)" CXXFLAGS="$F" CFLAGS="$F" >> build.log 2>&1
              fi
              # Flags MUST go on the make line. sdpa-gmp-omp's configure.ac does
              # AC_SUBST([CXXFLAGS],[""]) and discards configure-time flags entirely;
              # measured, that made this whole job vacuous on gmp (0 of 3671 compile
              # lines carried the flag, yet the two binaries still differed because the
              # build path is embedded -- so "binaries differ" is NOT a valid check).
              c=$(grep -E ' -c ' build.log | grep -c -- '-ftrivial-auto-var-init' || true)
              [ "${c:-0}" -ge 10 ] || { echo "FAIL: only $c compile lines carried the flag" >&2; exit 1; }
              grep -E ' -c ' build.log | grep -- 'sdpa_newton.cpp' | grep -q -- '-ftrivial-auto-var-init' \
                || { echo "FAIL: first-party TUs did not get the flag" >&2; exit 1; }
            )
          }
          build zero    build-zero
          build pattern build-pattern

      - name: identical output, or an uninitialised read has been found
        run: |
          set -u
          for p in SDPLIB/data/control1 SDPLIB/data/theta1 SDPLIB/data/truss5 SDPLIB/data/arch0 SDPLIB/data/gpp100 SDPLIB/data/mcp100; do
            [ -f "$p.dat-s.xz" ] && xz -dkf "$p.dat-s.xz"
          done
          sel() {   # same selector as the committed determinism step
            grep -E 'objValPrimal|objValDual|phase\.value|Iteration =|relative gap|feas\.error' "$1" || true
            awk '/^xVec *=/{f=1} f && !/time *=/' "$1"
          }
          # problems whose DEFAULT-parameter run ends PARTIAL (exit 3) in this fork
          PARTIAL_SET="SDPLIB/data/control1 SDPLIB/data/theta1 SDPLIB/data/arch0"
          : > z.sel; : > p.sel
          for d in example1 SDPLIB/data/control1 SDPLIB/data/theta1 SDPLIB/data/truss5 \
                   SDPLIB/data/arch0 SDPLIB/data/gpp100 SDPLIB/data/mcp100; do
            f="$d.dat-s"; test -f "$f" || { echo "FAIL: scheduled problem $f missing" >&2; exit 1; }
            # rc is captured and COMPARED: an intended PARTIAL (exit 3 -- at this
            # fork's default parameters control1/theta1/arch0 end there by design)
            # must not kill the step, but a zero-vs-pattern rc disagreement is
            # exactly the uninitialised-read signal this job exists to catch.
            # Remove BOTH outputs first (review2 §10.2): these names were reused
            # across problems, so a run that produced no output left the previous
            # problem's file in place and the selectors compared a stale solution.
            rm -f zo.out po.out
            rz=0; OMP_NUM_THREADS=2 ./build-zero/sdpa_dd    -ds "$f" -o zo.out -p param.sdpa >/dev/null 2>&1 || rz=$?
            rp=0; OMP_NUM_THREADS=2 ./build-pattern/sdpa_dd -ds "$f" -o po.out -p param.sdpa >/dev/null 2>&1 || rp=$?
            # Each rc must be the status EXPECTED FOR THIS PROBLEM, not merely
            # equal to the other and not merely "0 or 3" (review2 §13.3: a blanket
            # 0|3 lets an ordinary problem regress to PARTIAL in both instrumented
            # builds and still pass). control1, theta1 and arch0 are this fork's measured default-parameter PARTIAL cases.
            case " $PARTIAL_SET " in *" $d "*) want=3 ;; *) want=0 ;; esac
            for r in "$rz" "$rp"; do
              [ "$r" = "$want" ] || { echo "FAIL: $f exited $r, expected $want" >&2; exit 1; }
            done
            [ "$rz" = "$rp" ] || { echo "FAIL: $f rc differs, zero=$rz pattern=$rp" >&2; exit 1; }
            # and each run must have produced a real solution section of its own
            for o in zo.out po.out; do
              test -s "$o" || { echo "FAIL: $f produced no $o" >&2; exit 1; }
              sel "$o" | grep -q '{' || { echo "FAIL: $f $o has no solution rows" >&2; exit 1; }
            done
            echo "== $f rc=$rz" >> z.sel; sel zo.out >> z.sel
            echo "== $f rc=$rp" >> p.sel; sel po.out >> p.sel
          done
          test -s z.sel || { echo "FAIL: selector matched nothing" >&2; exit 1; }
          grep -q '^  *{' z.sel || { echo "FAIL: no indented matrix rows captured" >&2; exit 1; }
          # Positive control: a changed continuation row must be detectable.
          awk 'BEGIN{d=0} /^[[:space:]]+\{/ && !d {print "  {9.99e+99"; d=1; next} {print}' z.sel > z.mut
          diff -q z.sel z.mut >/dev/null && { echo "FAIL: control mutated nothing -- check is vacuous" >&2; exit 1; }
          diff -q z.mut p.sel >/dev/null && { echo "FAIL: comparison cannot detect a changed row" >&2; exit 1; }
          diff -u z.sel p.sel || {
            echo "FAIL: zero and pattern disagree -- there is a live uninitialised read." >&2
            echo "Bisect it: build everything =zero, then recompile subsets with =pattern" >&2
            echo "until the answer moves; the subset that moves it holds the read." >&2
            exit 1; }
# Job A -- AddressSanitizer + UndefinedBehaviorSanitizer (serial).
# Substitute sdpa_dd = sdpa_dd | sdpa_gmp | sdpa_qd per fork, and use the CONFIGURE
# line marked for that fork. Verified 2026-08-04 on pi (Ubuntu 24.04, gcc 13.3.0).
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential autoconf automake libtool
      # (libqd-dev as well, for sdpa-qd-omp)

      # The sanitizer harness must be able to fail. Prove it on a program with a
      # known defect before trusting a clean solver run.
      - name: harness self-check (a clean run must be a real result, not a silent no-op)
        run: |
          set -e
          printf '#include <cstdlib>\nint main(){int*p=new int[4];p[4]=1;int r=p[4];delete[] p;return r&1;}\n' > /tmp/sc.cpp
          g++ -fsanitize=address,undefined -fno-omit-frame-pointer -O1 -g /tmp/sc.cpp -o /tmp/sc
          set +e; ASAN_OPTIONS=detect_leaks=1:halt_on_error=0 /tmp/sc > /tmp/sc.log 2>&1; set -e
          grep -qE 'ERROR: AddressSanitizer|runtime error:' /tmp/sc.log \
            || { echo "FAIL: sanitizers did not report a known defect -- job would be vacuous" >&2; exit 1; }

      - run: autoreconf -fi          # dd / gmp only; sdpa-qd-omp ships configure
      # dd, gmp:
      - run: ./configure --enable-openmp=no
      # qd INSTEAD -- --enable-shared is REQUIRED: Makefile.am sets
      #   sdpa_qd_LDFLAGS = -static  under @ENABLE_SHARED_FALSE@, and
      #   "g++: error: cannot specify -static with -fsanitize=address" kills the link.
      # - run: ./configure --enable-shared --with-qd-includedir=/usr/include --with-qd-libdir=/usr/lib/x86_64-linux-gnu

      - name: build instrumented -- flags injected at MAKE time
        run: |
          set -e
          # NOT at configure time: sdpa-gmp-omp's configure.ac ends with
          #   AC_SUBST([CFLAGS], [""]) / AC_SUBST([CXXFLAGS], [""])
          # so ./configure CXXFLAGS=... is discarded and every first-party object is
          # built plain -O2 -march=native. Measured: 0 of 3671 compile lines carried
          # -fsanitize, 0 __asan_report_* in sdpa_io.o -- the job passed vacuously.
          SAN="-fsanitize=address,undefined -fno-omit-frame-pointer -O1 -g"
          make -j"$(nproc)" CXXFLAGS="$SAN" CFLAGS="$SAN" LDFLAGS="$SAN" || true
          MK=$(find . -path '*spooles*' -name Make.inc | head -1)
          if [ -n "$MK" ]; then
            sed -i 's|^# CC = gcc|  CC = gcc|' "$MK"
            # SPOOLES hardcodes its own CFLAGS; without this it links UNinstrumented
            # and ASan sees only allocator-level errors inside it.
            # `override` is REQUIRED, not decoration: since 2026-08-05 patch-Make.inc sets
            # the SPOOLES flags with `override CFLAGS += ...` (so that a CFLAGS passed on the
            # make line by this job and by auto-var-init cannot silently take the GCC-14
            # -Wno-error= rescue flags away). Once a variable has been set by an override
            # directive, a LATER ORDINARY `CFLAGS +=` in the same makefile is IGNORED --
            # verified, not assumed -- so a plain += here would drop $SAN without a word and
            # the instrumentation assertion below would be the only thing that noticed.
            printf '\n  override CFLAGS += %s\n' "$SAN" >> "$MK"
            d=$(dirname "$MK")
            ( cd "$d" && find . -name '*.o' -delete && rm -f spooles.a && make global -f makefile \
              && { cp spooles.a ../../../i/SPOOLES/lib/libspooles.a 2>/dev/null || cp spooles.a ./libspooles.a; } )
          fi
          rm -f ./sdpa_dd
          make -j"$(nproc)" CXXFLAGS="$SAN" CFLAGS="$SAN" LDFLAGS="$SAN"

      - name: instrumentation actually reached the code under test
        run: |
          set -e
          # automake emits PER-TARGET object names when the program carries its own
          # CXXFLAGS, so the object is sdpa_dd-sdpa_io.o, not sdpa_io.o. Checking the bare
          # name made `nm` fail on a nonexistent file, grep -c return 0, and this
          # assertion fire whether or not instrumentation was applied -- it could never
          # have passed. Locate the object, and assert it EXISTS before asking whether
          # it is instrumented, so "absent" and "not instrumented" stay distinguishable.
          obj=$(find . -name '*sdpa_io.o' -print -quit)
          [ -n "$obj" ] || { echo "FAIL: no sdpa_io object found -- the build did not produce one" >&2; exit 1; }
          echo "instrumentation check target: $obj"
          n=$(nm "$obj" 2>/dev/null | grep -c __asan_report || true)
          [ "${n:-0}" -ge 1 ] || { echo "FAIL: $obj is not instrumented -- flags were dropped" >&2; exit 1; }
          s=$(find . -name 'libspooles.a' -exec nm {} \; 2>/dev/null | grep -c __asan_report || true)
          [ "${s:-0}" -ge 1 ] || { echo "FAIL: SPOOLES is not instrumented" >&2; exit 1; }

      - name: run under sanitizers -- any report fails the job
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=0:halt_on_error=0:print_stacktrace=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=0
        run: |
          set -u
          : > san.log
          # dd / gmp ship SDPLIB; truss5/truss6 are the problems that reach the SPOOLES
          # ordering path (m > 100 and nBlock > 5). sdpa-qd-omp ships no SDPLIB, so it
          # gets example1 only -- see the note in the review.
          for p in SDPLIB/data/control1 SDPLIB/data/hinf1 SDPLIB/data/truss5 SDPLIB/data/truss6; do
            [ -f "$p.dat-s.xz" ] && xz -dkf "$p.dat-s.xz"
          done
          # Line 5 is the b-vector ("48, -8, 20"); the FIRST SPARSE RECORD is line 6.
          # Mutating line 5 made these cases fail for unrelated parse errors, so they were
          # green while testing nothing they claim. Print the line so a future move is visible.
          echo "fixture target line 6: $(sed -n 6p example1.dat-s)"
          awk 'NR==6 {print "1 1 -3 -3 1.0"; next} {print}' example1.dat-s > neg-index.dat-s
          printf '*comment only\n' > cmt.dat-s
          head -3 example1.dat-s > trunc.dat-s
          # The step runs under `set -e`, and the malformed cases exit non-zero BY DESIGN
          # -- more so since the fixtures were corrected to mutate the sparse record
          # instead of the b-vector, which made them actually reject. Without `|| true`
          # the helper aborts the whole step at the first malformed case, and the job
          # fails with no sanitizer report and no diagnostic, which is what happened.
          # rc must be captured from the COMMAND, not from `true` (review2 finding
          # 9: the previous form logged rc=0 for every case, so a missing binary,
          # a timeout, or a wrong-reason rejection all passed). set -e is
          # neutralised by capturing in an if.
          # One TSV record per case: name, observed rc, expected-rc pattern. The
          # schedule is EXPLICIT -- asserted against a written-out case list
          # below, never derived from whichever fixtures happen to exist.
          run() { local name=$1 exp=$2; shift 2
                  echo "#### case=$name" >> san.log
                  local rc=0; ( "$@" ) >> san.log 2>&1 || rc=$?
                  printf '%s\t%s\t%s\n' "$name" "$rc" "$exp" >> cases.tsv; }
          : > cases.tsv
          run example1     0     ./sdpa_dd -ds example1.dat-s -o /tmp/e1  -p param.sdpa
          # SDPLIB cases accept 0 or 3: whether a problem ends pdOPT or PARTIAL
          # at default parameters is a property of the trajectory, and this
          # instrumented -O1 build makes no trajectory promises. What this job
          # asserts is no sanitizer report and no signal/timeout death.
          for p in SDPLIB/data/control1 SDPLIB/data/hinf1 SDPLIB/data/truss5 SDPLIB/data/truss6; do
            test -f "$p.dat-s" || { echo "FAIL: scheduled fixture $p.dat-s missing" >&2; exit 1; }
            run "$(basename $p)" '0|3' ./sdpa_dd -ds "$p.dat-s" -o /tmp/o -p param.sdpa
          done
          run neg-index    1     ./sdpa_dd -ds neg-index.dat-s -o /tmp/n  -p param.sdpa
          run comment-only 1     timeout 120 ./sdpa_dd -ds cmt.dat-s -o /tmp/c -p param.sdpa
          run truncated    1     ./sdpa_dd -ds trunc.dat-s -o /tmp/t  -p param.sdpa
          # Grep the aggregate rather than trusting exit codes: the solver exits
          # non-zero on the malformed cases by design, so rc cannot distinguish
          # "rejected correctly" from "rejected after a sanitizer report".
          if grep -nE 'ERROR: AddressSanitizer|ERROR: LeakSanitizer|runtime error:' san.log; then
            echo "FAIL: sanitizer report(s) above" >&2; exit 1
          fi
          # Per-case exit-code assertions (review2 finding 9, repaired per §8.2:
          # the first version expected 4 cases where 8 run, asserted a bad-block
          # case this job never runs, and its awk name-capture rule also matched
          # the rc lines, erasing every case name). Every scheduled case must
          # run exactly once and return its expected code -- not a signal, not
          # a timeout, not merely nonzero.
          cat cases.tsv
          awk -F'\t' 'BEGIN { n = split("example1 control1 hinf1 truss5 truss6 neg-index comment-only truncated", w, " ") }
               { seen[$1]++
                 if ($2 !~ ("^(" $3 ")$")) { printf "FAIL: case %s rc=%s expected %s\n", $1, $2, $3; bad=1 } }
               END { for (i=1;i<=n;i++) if (seen[w[i]] != 1) { printf "FAIL: case %s ran %d time(s), expected once\n", w[i], seen[w[i]]+0; bad=1 }
                     if (NR != n) { printf "FAIL: %d records for %d scheduled cases\n", NR, n; bad=1 }
                     exit bad }' cases.tsv
  warnings:
    # Promote the two warning classes this project has actually shipped bugs in:
    #   -Wreturn-type   -- rdpotf2_ fell off the end of a non-void function, and eight
    #                      functions in qd's mpack/Mutils.cpp compiled to empty bodies.
    #   -Wuninitialized -- four SOCP_sp_* locals were passed to C.initialize() unassigned.
    # NOTE the two-stage build. Promotion CANNOT be tree-wide: -Werror=uninitialized also
    # promotes -Wmaybe-uninitialized, and `make CXXFLAGS=...` reaches every bundled
    # dependency. On gmp the bundled GMP's own configure probes the compiler with a program
    # that reads an uninitialised variable and would fail with a message pointing nowhere
    # near the cause; on dd, SPOOLES QRreduce.c and sort.c become hard errors. So: build
    # normally first, then recompile ONLY the first-party TUs with the strict flags.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential autoconf automake libtool clang
      - name: normal build first (third-party deps must not see the strict flags)
        run: |
          set -e
          autoreconf -fi >/dev/null 2>&1 || true
          ./configure --enable-openmp=no >/dev/null
          make -j"$(nproc)" >build.log 2>&1 || true
          MK=$(find . -path '*spooles*' -name Make.inc | head -1)
          if [ -n "$MK" ] && [ ! -x ./sdpa_dd ]; then
            sed -i 's|^# CC = gcc|  CC = gcc|' "$MK"; d=$(dirname "$MK")
            ( cd "$d" && find . -name '*.o' -delete && rm -f spooles.a && make global -f makefile >/dev/null 2>&1 \
              && { cp spooles.a ../../../i/SPOOLES/lib/libspooles.a 2>/dev/null || cp spooles.a ./libspooles.a; } )
            make -j"$(nproc)" >>build.log 2>&1
          fi
          test -x ./sdpa_dd
      - name: recompile first-party translation units with the classes promoted to errors
        run: |
          set -e
          CXX=${{ matrix.cc == 'gcc' && 'g++' || 'clang++' }}
          F="-O2 -funroll-all-loops -Werror=return-type -Werror=uninitialized"
          touch sdpa_*.cpp
          make -j"$(nproc)" CXX="$CXX" CXXFLAGS="$F" 2>&1 | tee strict.log
          # The flags MUST actually be on the compile lines. sdpa-gmp-omp's configure.ac
          # does AC_SUBST([CXXFLAGS],[""]) and silently discards configure-time flags, so an
          # earlier draft of this job passed while testing nothing at all. Comparing binary
          # checksums does NOT detect that -- the build path is embedded and they differ
          # regardless. Grepping the compile lines is the only sound check.
          n=$(grep -c -- '-Werror=return-type' strict.log || true)
          [ "$n" -ge 1 ] || { echo "FAIL: strict flags never reached a compile line" >&2; exit 1; }
          echo "strict flags present on $n compile line(s)"

  build-guards:
    # NEGATIVE tests for the two build guards added 2026-08-20. Every other job in this file
    # proves a build that SHOULD work does work. None of them proved that a build that should
    # FAIL actually fails -- so the guards themselves were untested, and a guard that never
    # fires is indistinguishable from no guard at all.
    #
    # Four cases, each asserting on the guard's own message so that a build failing for some
    # unrelated reason cannot be mistaken for the guard working.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: host build deps, with retries -- GitHub's apt mirrors stall intermittently
        run: |
          set -e
          for i in 1 2 3 4; do
            if timeout 180 sudo apt-get update -o Acquire::Retries=3; then break; fi
            echo "apt-get update attempt $i timed out or failed; retrying" >&2
            [ "$i" = 4 ] && { echo "FAIL: apt-get update failed 4 times" >&2; exit 1; }
            sleep $((i * 15))
          done
          for i in 1 2 3 4; do
            if timeout 300 sudo apt-get install -y -o Acquire::Retries=3 build-essential autoconf automake libtool; then break; fi
            echo "apt-get install attempt $i timed out or failed; retrying" >&2
            [ "$i" = 4 ] && { echo "FAIL: apt-get install failed 4 times" >&2; exit 1; }
            sleep $((i * 15))
          done
      - run: autoreconf -fi
      - name: guard 1 -- a C++ compiler without OpenMP must ABORT configure, not build serial
        run: |
          set -e
          # AC_OPENMP does not fail on a compiler that lacks OpenMP: it records "unsupported"
          # and continues, which is how a SERIAL binary can be produced by a run that reports
          # success. The guard turns that into an error. Tested with a wrapper that rejects
          # every OpenMP flag rather than with a real compiler, so the test does not depend on
          # whether the runner image happens to ship libomp.
          mkdir -p "$HOME/fakebin"
          # printf, NOT a heredoc: a heredoc body inside an indented YAML block keeps the
          # block's leading spaces, so "#!/bin/sh" would be written indented and the shebang
          # would not be honoured -- the wrapper would run under the wrong shell or not at all.
          {
            printf '#!/bin/sh\n'
            printf 'for a in "$@"; do\n'
            printf '  case "$a" in\n'
            printf '    -fopenmp*|-xopenmp*|-openmp|-qsmp*|-mp|-omp*|-Popenmp*|--openmp*|-homp|-qopenmp*)\n'
            printf '      echo "$0: unrecognized command line option $a" >&2; exit 1;;\n'
            printf '  esac\n'
            printf 'done\n'
            printf 'exec g++ "$@"\n'
          } > "$HOME/fakebin/noomp-g++"
          chmod +x "$HOME/fakebin/noomp-g++"
          head -1 "$HOME/fakebin/noomp-g++" | grep -qx '#!/bin/sh' \
            || { echo "FAIL: wrapper shebang is not on line 1 unindented; the test would be vacuous" >&2; exit 1; }
          # sanity: the wrapper must actually reject the flag, or this test proves nothing
          if "$HOME/fakebin/noomp-g++" -fopenmp -x c++ /dev/null -o /dev/null 2>/dev/null; then
            echo "FAIL: the no-OpenMP wrapper accepted -fopenmp; the test is vacuous" >&2; exit 1
          fi
          # ...and must otherwise work, or configure would fail for the wrong reason
          echo 'int main(){return 0;}' > /tmp/t.cpp
          "$HOME/fakebin/noomp-g++" /tmp/t.cpp -o /tmp/t \
            || { echo "FAIL: the wrapper cannot compile at all; the test would be misleading" >&2; exit 1; }

          set +e
          ./configure --enable-openmp=yes CXX="$HOME/fakebin/noomp-g++" > guard1.log 2>&1
          rc=$?
          set -e
          [ "$rc" -ne 0 ] || { echo "FAIL: configure SUCCEEDED with a compiler that has no OpenMP -- the guard is gone, and this build would be silently serial" >&2; tail -20 guard1.log >&2; exit 1; }
          grep -q "does not support OpenMP" guard1.log \
            || { echo "FAIL: configure failed, but not with the guard's message -- it broke for some other reason, so this proves nothing" >&2; tail -30 guard1.log >&2; exit 1; }
          echo "guard 1: configure aborted with '$(grep -m1 "does not support OpenMP" guard1.log)'"
      - name: guard 1 escape hatch -- --disable-openmp with the SAME compiler must SUCCEED
        run: |
          set -e
          # A guard that cannot be turned off deliberately is a bug, not a safeguard. The
          # documented escape must work, or users with no OpenMP cannot build at all.
          make distclean > /dev/null 2>&1 || true
          ./configure --disable-openmp CXX="$HOME/fakebin/noomp-g++" > guard1b.log 2>&1 \
            || { echo "FAIL: --disable-openmp did not survive a compiler without OpenMP" >&2; tail -20 guard1b.log >&2; exit 1; }
          echo "guard 1 escape hatch: --disable-openmp configures cleanly"
      - name: guard 2 -- SPOOLES refuses an empty, POSIX-default, or incapable CC
        run: |
          set -e
          # The guards sit at the top of the work/$(BUILD_STAMP) recipe and fire before any
          # compilation, so the configure stamp is faked rather than earned: this tests the
          # guards, not the SPOOLES build, and takes seconds instead of minutes.
          make distclean > /dev/null 2>&1 || true
          ./configure --enable-openmp=no > cfgg2.log 2>&1 || { tail -20 cfgg2.log >&2; exit 1; }
          mkdir -p external/spooles/work
          touch external/spooles/work/.spooles_configure_done

          expect_fail() {  # expect_fail <label> <needle> <make-args...>
            label=$1; needle=$2; shift 2
            set +e
            out=$(make -C external/spooles work/.spooles_build_done "$@" 2>&1)
            rc=$?
            set -e
            [ "$rc" -ne 0 ] || { echo "FAIL: $label -- make SUCCEEDED; the guard did not fire" >&2; echo "$out" >&2; exit 1; }
            echo "$out" | grep -q "$needle" \
              || { echo "FAIL: $label -- make failed but without '$needle', so it broke for another reason" >&2; echo "$out" >&2; exit 1; }
            echo "  $label: fired with '$needle'"
          }

          expect_fail "empty CC"        "CC is empty"                  CC=
          expect_fail "POSIX default"   "c99 rejects the -f flags"     CC=c99

          # An INCAPABLE compiler that is NOT named c99. The name check cannot catch this; the
          # -funroll-all-loops capability probe is what does. Without this case the probe could
          # be deleted and every other test here would still pass.
          {
            printf '#!/bin/sh\n'
            printf 'for a in "$@"; do case "$a" in -f*) echo "$0: illegal option" >&2; exit 1;; esac; done\n'
            printf 'exec cc "$@"\n'
          } > "$HOME/fakebin/nof-cc"
          chmod +x "$HOME/fakebin/nof-cc"
          head -1 "$HOME/fakebin/nof-cc" | grep -qx '#!/bin/sh' \
            || { echo "FAIL: probe wrapper shebang is indented; the test would be vacuous" >&2; exit 1; }
          "$HOME/fakebin/nof-cc" -funroll-all-loops -c /dev/null -o /tmp/x.o 2>/dev/null \
            && { echo "FAIL: the incapable wrapper ACCEPTED -funroll-all-loops; the probe test is vacuous" >&2; exit 1; }
          case "$HOME/fakebin/nof-cc" in *c99) echo "FAIL: rename the probe wrapper; it must NOT end in c99 or it tests the name check" >&2; exit 1;; esac
          expect_fail "incapable CC"    "rejects -funroll-all-loops"   CC="$HOME/fakebin/nof-cc"

          # And a capable compiler must get PAST the guards. Verified by the message NOT being
          # a guard message: the recipe then proceeds into the real SPOOLES build, which has no
          # extracted tree here, so it fails later and differently. That is the pass condition.
          set +e
          out=$(make -C external/spooles work/.spooles_build_done CC=gcc 2>&1)
          set -e
          if echo "$out" | grep -qE "CC is empty|c99 rejects the -f flags|rejects -funroll-all-loops"; then
            echo "FAIL: a capable compiler (gcc) was rejected by one of the guards -- false positive" >&2
            echo "$out" >&2; exit 1
          fi
          echo "  capable CC (gcc): passed all three guards"
          echo "guard 2: empty, POSIX-default and incapable compilers all rejected; gcc accepted"

# NOTE: gmp's `portable-build` job is deliberately NOT ported here. It exists because gmp's build
# defaults to -march=native and the job verifies that a portable override actually removes it.
# dd's configure.ac and Makefile.am contain no -march=native at all (grep: 0 hits against gmp's
# 10), so dd's default build is already portable and there is nothing for that job to assert.
# Porting it would have meant asserting a flag dd does not use -- CI reported exactly that as
# "the -march=native probe did not run or did not pass". A job that asserts a false premise is
# worse than an absent one.

  installer:
    # The packaged installer IS the advertised path (README: "one-command"; the install-sdpa-omp
    # skill makes it the standard route), yet until 2026-08-22 CI reconstructed the same build
    # by hand and never executed install.sh itself -- so a regression in the installer would ship
    # with green CI. This job runs the script exactly as a user would, both modes, in one tree
    # (the second run also exercises the mode switch and the unconditional autoreconf on a tree
    # that already has a configure). The gmp copy of this job also strict-checks a five-host
    # benchmark archive; dd has no such archive, so that step is deliberately absent rather than
    # stubbed -- a step that validates nothing is worse than no step.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: host build deps, with retries -- same rationale as the build jobs
        run: |
          set -e
          for i in 1 2 3 4; do
            if timeout 180 sudo apt-get update -o Acquire::Retries=3; then break; fi
            echo "apt-get update attempt $i timed out or failed; retrying" >&2
            [ "$i" = 4 ] && { echo "FAIL: apt-get update failed 4 times" >&2; exit 1; }
            sleep $((i * 15))
          done
          for i in 1 2 3 4; do
            if timeout 300 sudo apt-get install -y -o Acquire::Retries=3 build-essential autoconf automake libtool; then break; fi
            echo "apt-get install attempt $i timed out or failed; retrying" >&2
            [ "$i" = 4 ] && { echo "FAIL: apt-get install failed 4 times" >&2; exit 1; }
            sleep $((i * 15))
          done
      - name: packaged installer, default OpenMP path
        run: |
          set -e
          bash .claude/skills/install-sdpa-omp/scripts/install.sh 2>&1 | tee /tmp/inst1.log
          grep -q "OpenMP runtime markers: 1" /tmp/inst1.log \
            || { echo "FAIL: OpenMP install did not report a linked OpenMP runtime" >&2; exit 1; }
          tail -1 /tmp/inst1.log | grep -q "OMP_NUM_THREADS" \
            || { echo "FAIL: OpenMP install must end with thread guidance" >&2; exit 1; }
      - name: packaged installer, --serial in the SAME tree (mode switch + reconfigure)
        run: |
          set -e
          bash .claude/skills/install-sdpa-omp/scripts/install.sh --serial 2>&1 | tee /tmp/inst2.log
          grep -q "OpenMP runtime markers: 0" /tmp/inst2.log \
            || { echo "FAIL: serial install reported OpenMP markers" >&2; exit 1; }
          tail -1 /tmp/inst2.log | grep -q "SERIAL" \
            || { echo "FAIL: a serial install must not end with OpenMP advice (finding 2 of the 2026-08-22 review)" >&2; exit 1; }

  omp-data-sharing:
    # The leg that would have caught the bug that shipped: the released tip could not be
    # compiled AT ALL by GCC 8, and nothing noticed. See review/GCC8-PORTABILITY-FIX-PLAN.md.
    #
    # Two compilers, because the two OpenMP revisions disagree and each rejects a DIFFERENT
    # wrong spelling. Auditing the other jobs showed why neither was reachable: the only clang
    # leg configures --enable-openmp=no, so clang never parses a pragma at all, and every job
    # that does compile OpenMP runs the runner's default GCC (>= 13). Catching this needs
    # GCC <= 8 WITH OpenMP on, or clang WITH OpenMP on, and no job satisfied either conjunction.
    #
    # Syntax-only, deliberately. This class of bug is a front-end diagnostic, so parsing is
    # enough, and it costs seconds where a full build per compiler costs ~10 minutes. It will
    # NOT catch link errors, ABI problems or miscompilation -- a chosen limit, so that the leg
    # stays cheap enough to remain switched on.
    #
    # The old compiler runs via `docker run` rather than `container:`, so the checkout happens
    # on the host with a current Node. actions/checkout inside an end-of-life image is a
    # well-known way to lose an afternoon to glibc.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: host deps, and the vendored SPOOLES headers
        run: |
          set -e
          # Same retry discipline as the other apt steps -- see "host build deps, with retries".
          for i in 1 2 3 4; do timeout 180 sudo apt-get update -o Acquire::Retries=3 && break
            [ "$i" = 4 ] && { echo "FAIL: apt-get update failed 4 times" >&2; exit 1; }; sleep $((i*15)); done
          for i in 1 2 3 4; do timeout 300 sudo apt-get install -y -o Acquire::Retries=3 \
              --no-install-recommends clang libomp-dev libqd-dev && break
            [ "$i" = 4 ] && { echo "FAIL: apt-get install failed 4 times" >&2; exit 1; }; sleep $((i*15)); done
          # SPOOLES is a tracked tarball, so this needs no network.
          mkdir -p /tmp/sp && tar xzf external/spooles/download/spooles.2.2.tgz -C /tmp/sp
      - name: clang with OpenMP ON -- real sources, plus a control that must FAIL
        run: |
          set -e
          I="-I. -Implapack -I/tmp/sp"
          clang++ -fsyntax-only -fopenmp $I sdpa_linear.cpp sdpa_newton.cpp
          clang++ -fsyntax-only -fopenmp tests/omp_datasharing.cpp
          # NON-VACUITY: a leg that only compiles code that works cannot tell you it still
          # detects code that does not.
          if clang++ -fsyntax-only -fopenmp -DSPELLING_BAD_UNLISTED tests/omp_datasharing.cpp 2>/dev/null; then
            echo "FAIL: clang accepted a const left out of default(none) -- this leg no longer" >&2
            echo "      enforces the OpenMP 5.0 rule it exists to enforce" >&2
            exit 1
          fi
          echo "clang: real sources parse with OpenMP on, and the 5.0 rule is enforced"
      - name: GCC 8 -- the compiler the released tip could not be built by
        run: |
          set -e
          docker run --rm -v "$PWD:/w" -w /w gcc:8 bash -c '
            set -e
            # Debian buster is past end of life, so its mirrors have moved to archive.
            apt-get update >/dev/null 2>&1 || {
              sed -i "s|deb.debian.org|archive.debian.org|g; s|security.debian.org|archive.debian.org|g; /-updates/d" /etc/apt/sources.list
              apt-get -o Acquire::Check-Valid-Until=false update >/dev/null
            }
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libqd-dev >/dev/null
            g++ --version | head -1
            g++ -fsyntax-only -fopenmp -I. -Implapack sdpa_linear.cpp
            g++ -fsyntax-only -fopenmp tests/omp_datasharing.cpp
            if g++ -fsyntax-only -fopenmp -DSPELLING_BAD_SHARED_CONST tests/omp_datasharing.cpp 2>/dev/null; then
              echo "FAIL: GCC 8 accepted a const named in shared() -- this leg no longer" >&2
              echo "      detects the exact bug it was added for" >&2
              exit 1
            fi
            echo "gcc 8: sdpa_linear.cpp parses, and the OpenMP 4.5 rule is enforced"
          '
      - name: the coverage claim must not go stale
        run: |
          set -e
          # The GCC 8 leg checks sdpa_linear.cpp, which is where every default(none) in the
          # tree lives. If one appears elsewhere, the claim silently narrows -- so fail loudly
          # and say what to do instead.
          f=$(grep -rl "default(none)" sdpa_*.cpp | sort | tr "\n" " ")
          if [ "$f" != "sdpa_linear.cpp " ]; then
            echo "FAIL: default(none) now appears in: $f" >&2
            echo "      The GCC 8 leg only syntax-checks sdpa_linear.cpp. Add the new file to" >&2
            echo "      that step, or this job stops covering what it claims to cover." >&2
            exit 1
          fi
          echo "coverage: every default(none) in the tree is in a file this job checks"

  spchol-threading:
    # C8 of the port plan. The sparse Schur Cholesky and SDPA_BMAT_MODE landed on dev with their
    # evidence gathered by hand on one machine; this job is what keeps them honest afterwards.
    # It asserts three things no other job here can:
    #   1. NON-VACUITY -- SDPA_SPCHOL_LOG must report pivots actually threaded. Without this a
    #      green run proves nothing, because the gates could silently reject every pivot.
    #   2. BIT-IDENTITY across thread counts, which is the property the threading claims by
    #      construction (each k1 owns a disjoint destination row).
    #   3. STRICT PARSING of every knob, including wrong case, on a problem that routes DENSE --
    #      the exact hole a negative test caught during development, where the validator lived
    #      inside the sparse overload and so never ran for dense-route problems.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: host build deps, with retries
        run: |
          set -e
          for i in 1 2 3 4; do
            if timeout 180 sudo apt-get update -o Acquire::Retries=3; then break; fi
            [ "$i" = 4 ] && { echo "FAIL: apt-get update failed 4 times" >&2; exit 1; }
            sleep $((i * 15))
          done
          for i in 1 2 3 4; do
            if timeout 300 sudo apt-get install -y -o Acquire::Retries=3 build-essential autoconf automake libtool; then break; fi
            [ "$i" = 4 ] && { echo "FAIL: apt-get install failed 4 times" >&2; exit 1; }
            sleep $((i * 15))
          done
      - run: autoreconf -fi
      - run: ./configure --enable-openmp=yes
      - run: make -j"$(nproc)"
      - name: strict parsing -- every knob, on a DENSE-route problem
        run: |
          set -e
          # example1 is m=10, so it exits at gate 1 and never reaches the sparse Cholesky. That
          # is the point: these validators must fire anyway.
          for bad in "SDPA_SPCHOL_MODE=bogus" "SDPA_SPCHOL_MODE=Auto" \
                     "SDPA_DD_MIN_SPCHOL_WORK=abc" "SDPA_DD_MIN_SPCHOL_WIDTH=-" \
                     "SDPA_BMAT_MODE=bogus" "SDPA_BMAT_MODE=Fill" \
                     "SDPA_BMAT_MAX_GB=" "SDPA_BMAT_MAX_GB=abc" "SDPA_BMAT_MAX_GB=-1" \
                     "SDPA_SPCHOL_DIGEST_DUMP=/no/such/dir/dump.bin" \
                     "SDPA_SPCHOL_MUTATE=1" "SDPA_SPCHOL_MUTATE=2" "SDPA_SPCHOL_MUTATE=yes" \
                     "SDPA_SPCHOL_MODE=Legacy" \
                     "SDPA_BMAT_ASM_CENSUS=yes" "SDPA_BMAT_ASM_CENSUS=2" \
                     "SDPA_BMAT_TEST_BREAK_INVARIANT=1" "SDPA_BMAT_TEST_F2_STALE=1" \
                     "SDPA_DD_MIN_SPCHOL_WORK=" "SDPA_DD_MIN_SPCHOL_WORK=-5" \
                     "SDPA_DD_MIN_SPCHOL_WORK=+5" "SDPA_DD_MIN_SPCHOL_WORK=1.5" \
                     "SDPA_DD_MIN_SPCHOL_WORK=18446744073709551616" \
                     "SDPA_DD_MIN_SPCHOL_WIDTH=-1" "SDPA_DD_MIN_SPCHOL_TOTAL=-1"; do
            if env $bad ./sdpa_dd -ds example1.dat-s -o /tmp/o -p param.sdpa >/tmp/l 2>&1; then
              echo "FAIL: $bad was ACCEPTED -- a typo must not select a default silently" >&2
              exit 1
            fi
            grep -qE "must be|is set but empty|cannot open|was not built with" /tmp/l \
              || { echo "FAIL: $bad exited nonzero but printed no diagnostic" >&2; cat /tmp/l; exit 1; }
            echo "  refused: $bad"
          done
          # ...and every VALID value must still be accepted, or the parser is just broken.
          for ok in "SDPA_SPCHOL_MODE=auto" "SDPA_SPCHOL_MODE=serial" "SDPA_SPCHOL_MODE=force" \
                    "SDPA_SPCHOL_MODE=legacy" \
                    "SDPA_BMAT_MODE=auto" "SDPA_BMAT_MODE=fill" "SDPA_BMAT_MODE=legacy" \
                    "SDPA_BMAT_MODE=dense" \
                    "SDPA_BMAT_MAX_GB=100" "SDPA_SPCHOL_LOG=0" \
                    "SDPA_BMAT_ASM_CENSUS=0" "SDPA_BMAT_ASM_CENSUS=1" \
                    "SDPA_BMAT_TEST_BREAK_INVARIANT=0" "SDPA_BMAT_TEST_F2_STALE=0" \
                    "SDPA_DD_MIN_SPCHOL_WORK=0" "SDPA_DD_MIN_SPCHOL_TOTAL=0"; do
            env $ok ./sdpa_dd -ds example1.dat-s -o /tmp/o -p param.sdpa >/dev/null 2>&1 \
              || { echo "FAIL: valid setting $ok was refused" >&2; exit 1; }
            echo "  accepted: $ok"
          done
      - name: non-vacuity + bit-identity on a problem that reaches the sparse path
        run: |
          set -e
          # Build a problem big enough to clear gate 1 (m > 100) and route sparse. Forced sparse
          # plus forced parallel guarantees the threaded path is exercised regardless of gates,
          # so this cannot pass by silently running serial.
          python3 tests/gen_spchol_fixture.py > spchol_fix.dat-s
          m=$(sed -n 1p spchol_fix.dat-s)
          echo "fixture mDIM=$m"
          SDPA_BMAT_MODE=sparse SDPA_SPCHOL_MODE=force SDPA_SPCHOL_LOG=1 OMP_NUM_THREADS=4 \
            ./sdpa_dd -ds spchol_fix.dat-s -o /tmp/s4 -p param.sdpa > /tmp/log4 2>&1 || true
          grep -aoE "spchol: team=[0-9]+ pivots_threaded=[0-9]+ pivots_serial=[0-9]+" /tmp/log4 | head -1
          thr=$(grep -aoE "pivots_threaded=[0-9]+" /tmp/log4 | head -1 | cut -d= -f2)
          [ "${thr:-0}" -ge 1 ] \
            || { echo "FAIL: no pivot ran threaded -- this job would be vacuous" >&2; cat /tmp/log4; exit 1; }
          echo "  route OK: $thr pivots entered the workshared arm"
          # ...but that is a ROUTE check, not execution proof. A dynamic worksharing loop can be
          # run entirely by ONE thread while the log reports a full team and every pivot
          # "threaded" -- observed on the previous, narrower fixture, which reported
          # "team=2 workers that updated 1" at 8 threads. Assert WORKERS, not pivots.
          wu=$(sed -n 's/.*workers that updated \([0-9]*\).*/\1/p' /tmp/log4 | head -1)
          [ "${wu:-0}" -ge 2 ] \
            || { echo "FAIL: only ${wu:-0} worker(s) updated the factor -- the threading did not"
                 echo "      actually distribute, so every comparison below is vacuous." >&2
                 cat /tmp/log4; exit 1; }
          echo "  non-vacuity OK: $wu workers updated the factor"
          # ---------------------------------------------------------------- bit-identity
          # THREE comparisons, weakest to strongest. The first version of this job had only the
          # weakest one and called the result "bit-identical", which overstated what it tested:
          # a review pointed out that one objValPrimal line is a summary field, not the factor,
          # and a 1-ulp change deep in a mantissa does not reach it. Demonstrated, not assumed --
          # the mutation step below perturbs the factor by one ulp and objValPrimal does not move.
          rm -f /tmp/objs /tmp/dig.*
          for th in 1 2 4; do
            SDPA_BMAT_MODE=sparse SDPA_SPCHOL_MODE=force SDPA_SPCHOL_DIGEST_DUMP=/tmp/dig.$th \
              OMP_NUM_THREADS=$th \
              ./sdpa_dd -ds spchol_fix.dat-s -o /tmp/bi.$th -p param.sdpa >/dev/null 2>&1
            rc=$?
            # The exit status is part of the result. The previous version discarded it with
            # `|| true`, so a run that died could still contribute a matching line.
            [ "$rc" = 0 ] || { echo "FAIL: solver exited $rc at $th threads" >&2; exit 1; }
            [ -s /tmp/bi.$th ]  || { echo "FAIL: empty solver output at $th threads" >&2; exit 1; }
            [ -s /tmp/dig.$th ] || { echo "FAIL: empty factor dump at $th threads" >&2; exit 1; }
            grep -a -m1 objValPrimal /tmp/bi.$th >> /tmp/objs
          done
          # (a) summary field. Weakest, kept because it is what a user sees.
          #     Count the LINES first: three identical lines and one single line both give
          #     "1 distinct", so without this the test passes when two arms produced nothing.
          nl=$(wc -l < /tmp/objs | tr -d ' ')
          [ "$nl" = 3 ] \
            || { echo "FAIL: collected $nl objective lines, expected 3" >&2; cat /tmp/objs >&2; exit 1; }
          [ "$(sort -u /tmp/objs | wc -l | tr -d ' ')" = 1 ] \
            || { echo "FAIL: objectives differ across 1/2/4 threads" >&2; cat /tmp/objs; exit 1; }
          echo "  (a) objValPrimal identical across 1/2/4 threads"
          # (b) the COMPLETE printed result, not one line of it. Timings and the output path are
          #     the only fields legitimately allowed to vary between two runs.
          # Everything from the "Time(sec)" header down is a per-phase timing table and cannot be
          # expected to match. Everything ABOVE it -- the full iteration table, both objectives,
          # the feasibility errors, the relative eps and the parameter echo -- must. Note this is
          # a much wider comparison than the timing-line filter it replaces, which left the
          # per-phase table in and could never have passed.
          norm () { sed -e "/Time(sec)/,\$d" "$1" | grep -av -E "^(out|data) +is|total time|start at|end at"; }
          # A normalisation that filters everything would make this pass vacuously, which is the
          # same failure mode the whole job exists to prevent. Require it to leave real content.
          nn=$(norm /tmp/bi.1 | wc -l | tr -d " ")
          [ "${nn:-0}" -ge 20 ] \
            || { echo "FAIL: normalisation left only $nn lines -- (b) would be vacuous." >&2
                 echo "      The solver's output format probably changed; fix norm()." >&2
                 exit 1; }
          for th in 2 4; do
            diff <(norm /tmp/bi.1) <(norm /tmp/bi.$th) > /tmp/d.$th \
              || { echo "FAIL: full output differs between 1 and $th threads" >&2
                   head -40 /tmp/d.$th >&2; exit 1; }
          done
          echo "  (b) complete printed output ($nn lines) identical across 1/2/4 threads"
          # (c) THE FACTOR ITSELF, byte for byte -- the claim the threading actually makes.
          #     A canonical length-framed stream over every live element's row, column and both
          #     IEEE limbs. This is a cmp(1), not a hash comparison.
          for th in 2 4; do
            cmp /tmp/dig.1 /tmp/dig.$th \
              || { echo "FAIL: FACTOR differs between 1 and $th threads" >&2; exit 1; }
          done
          echo "  (c) factor stream byte-identical across 1/2/4 threads ($(wc -c < /tmp/dig.1) bytes)"
      - name: the oracle's negative control -- prove it can reject
        run: |
          set -e
          # Everything above is worthless if the digest cannot tell two factors apart. Rebuild
          # with the test hook, perturb the finished factor by ONE ULP of the low limb, and
          # require (i) the factor stream to change and (ii) objValPrimal NOT to -- which is the
          # evidence that comparison (a) alone was never sufficient.
          make clean >/dev/null 2>&1 || true
          ./configure --enable-openmp=yes CXXFLAGS="-O2 -DSDPA_SPCHOL_TEST_HOOKS" >/dev/null
          make -j"$(nproc)" >/dev/null
          python3 tests/gen_spchol_fixture.py > spchol_fix.dat-s
          base () { # base <outfile> <dumpfile> [extra env]
            local o=$1 d=$2; shift 2
            rm -f "$d"
            env "$@" SDPA_BMAT_MODE=sparse SDPA_SPCHOL_MODE=force SDPA_SPCHOL_DIGEST_DUMP="$d" \
              OMP_NUM_THREADS=4 ./sdpa_dd -ds spchol_fix.dat-s -o "$o" -p param.sdpa >/dev/null 2>&1
          }
          base /tmp/clean /tmp/cleand
          base /tmp/mutd  /tmp/mutdd SDPA_SPCHOL_MUTATE=1
          if cmp -s /tmp/cleand /tmp/mutdd; then
            echo "FAIL: a one-ulp mutation did not change the factor stream." >&2
            echo "      The oracle is BLIND, so every comparison above proves nothing." >&2
            exit 1
          fi
          echo "  negative control OK: the factor stream detects a one-ulp change"
          # (b) must also see it -- it is the wider comparison, so if it cannot, norm() is
          # filtering away the result section rather than just the timings.
          norm () { sed -e "/Time(sec)/,\$d" "$1" | grep -av -E "^(out|data) +is|total time|start at|end at"; }
          if diff <(norm /tmp/clean) <(norm /tmp/mutd) >/dev/null; then
            echo "FAIL: the full-output comparison did not see a one-ulp factor change." >&2
            echo "      norm() is over-filtering, so check (b) proves nothing." >&2
            exit 1
          fi
          echo "  negative control OK: the full printed output also detects it"
          c=$(grep -a -m1 objValPrimal /tmp/clean | sed 's/.*= *//')
          m=$(grep -a -m1 objValPrimal /tmp/mutd  | sed 's/.*= *//')
          if [ "$c" = "$m" ]; then
            echo "  and objValPrimal did NOT move ($c) -- which is exactly why (a) alone"
            echo "  is not a test of factor identity, and why (b) and (c) exist."
          else
            echo "  note: objValPrimal moved ($c -> $m) on this fixture." >&2
          fi
          # And the hook must not exist in a normal build: a test-only mutation reachable from a
          # release binary is a defect, not a feature.
          make clean >/dev/null 2>&1 || true
          ./configure --enable-openmp=yes >/dev/null
          make -j"$(nproc)" >/dev/null
          if SDPA_SPCHOL_MUTATE=1 ./sdpa_dd -ds example1.dat-s -o /tmp/x -p param.sdpa >/tmp/nx 2>&1; then
            echo "FAIL: SDPA_SPCHOL_MUTATE was ACCEPTED by a build without the hook" >&2; exit 1
          fi
          grep -q "was not built with" /tmp/nx \
            || { echo "FAIL: refused, but with the wrong diagnostic" >&2; cat /tmp/nx; exit 1; }
          echo "  release build refuses the mutation hook"
      - name: published claims match the archived evidence
        run: |
          set -e
          # Four times in this campaign a claim was corrected in one copy and left standing in
          # another. This is the regression guard for the specific claims known to have been
          # wrong; it is narrow by design and is not a substitute for the .meta provenance.
          bash tests/check_doc_claims.sh
          # And the guard's OWN negative control: reintroduce each stale claim into a scratch
          # copy and require its rule to fire. The first version of the tolerance rule was dead
          # -- it allowed one asterisk where the document had two -- and this is what found it.
          bash tests/check_doc_claims.sh --self-test
          # Every relative link in the maintained documents must resolve in a FRESH CLONE. Five
          # benchmark citations once pointed at review/artifacts/, which exists only in the private
          # evidence repository, so no reader could follow the provenance the documents promised.
          bash tests/check_links.sh
          # doc/technical.pdf is a COMMITTED build product of doc/technical.tex -- the same
          # two-copies-of-one-claim shape as everything above. doc/build.sh writes the source's
          # SHA-256 into the PDF's own Info dictionary, and this greps the COMMITTED PDF for it,
          # so a .tex edited without a rebuild fails here. It reads the artefact it makes a claim
          # about; an earlier sidecar-file version did not, and a review caught that. (No TeX on
          # this runner, so the compile half is skipped; it runs where latexmk exists.)
          bash tests/check_doc_pdf.sh
          # And the published rows must still yield the published figures.
          python3 bench/validate.py
      - name: overflow guards -- the production helpers, at their boundaries
        run: |
          set -e
          # Calls sdpaTriangularCount / sdpaProduct / sdpaFitsInt from sdpa_tool.h -- the SAME
          # symbols the six guarded allocation sites use. A test that reimplements the guard
          # would prove the test author can write one, not that the allocations are guarded.
          g++ -I. -Iexternal/i/QD/include -O2 tests/overflow_guards.cpp -o /tmp/ovg \
              -Lexternal/i/QD/lib -lqd
          /tmp/ovg
          # The rError property has TWO halves and only one can be asserted from inside a
          # process the macro terminates. The false half is the `ok` line above; this is the
          # true half, in a subprocess. Required: nonzero status AND the streamed diagnostic.
          # Status 2 is the binary's own "the macro did not exit" report -- treat it as a
          # failure distinct from an assertion failure.
          set +e
          /tmp/ovg --rerror-true > /tmp/ovgt 2>&1
          st=$?
          set -e
          cat /tmp/ovgt
          if [ "$st" -eq 0 ]; then
            echo "FAIL: rError on a true condition did not exit nonzero" >&2; exit 1
          fi
          if [ "$st" -eq 2 ]; then
            echo "FAIL: rError on a true condition did not exit at all" >&2; exit 1
          fi
          grep -q "deliberate rError from the true branch, streaming 42 arguments" /tmp/ovgt \
            || { echo "FAIL: exited, but without the streamed diagnostic" >&2; exit 1; }
          echo "  rError exits nonzero and prints the diagnostic on a true condition"
      - name: advisory available memory -- reported, and never an admission decision
        run: |
          set -e
          # FINDING F. The number is a DIAGNOSTIC: it appears next to the requirement so that
          # "needs 21 GB" can be read against what the machine has, and nothing branches on it.
          # A route chosen from free memory would be a route that changes with the machine,
          # which is exactly the property this fork sells.
          SDPA_BMAT_LOG=1 ./sdpa_dd -ds example1.dat-s -o /tmp/av.out -p param.sdpa > /tmp/av.log 2>&1
          grep -aq "GB available (MemAvailable" /tmp/av.log \
            || { echo "FAIL: no advisory line on a Linux runner, where /proc/meminfo exists" >&2
                 grep -a "bmat:" /tmp/av.log; exit 1; }
          # It must be a real reading, not a placeholder: compare against /proc/meminfo itself.
          said=$(sed -n 's/.*about \([0-9.e+-]*\) GB available.*/\1/p' /tmp/av.log | head -1)
          real=$(awk '/MemAvailable/ {printf "%.3f", $2/1048576}' /proc/meminfo)
          echo "  reported ${said} GB, /proc/meminfo says ${real} GB"
          awk -v a="$said" -v b="$real" 'BEGIN {
            if (b <= 0 || (a - b) / b > 0.25 || (b - a) / b > 0.25) {
              printf "FAIL: advisory %s GB is not the machine reading %s GB\n", a, b > "/dev/stderr"; exit 1
            } }' \
            || exit 1
          # And it must carry the host/cgroup caveat rather than presenting itself as the limit.
          grep -aq "upper bound inside a memory" /tmp/av.log \
            || { echo "FAIL: advisory omits the host/cgroup caveat" >&2; exit 1; }
          # The cap message carries it too -- that is the message a stopped job actually reads.
          set +e
          SDPA_BMAT_MAX_GB=0.0000000001 ./sdpa_dd -ds example1.dat-s -o /tmp/cap.out \
            -p param.sdpa > /tmp/cap.log 2>&1
          cst=$?
          set -e
          [ "$cst" -ne 0 ] || { echo "FAIL: the cap did not stop the run" >&2; exit 1; }
          grep -aq "For reference this host reports about" /tmp/cap.log \
            || { echo "FAIL: the cap diagnostic does not report available memory" >&2
                 cat /tmp/cap.log; exit 1; }
          echo "  cap diagnostic reports available memory alongside the requirement"
          # NON-VACUITY: the advisory must not change the route. Same problem, and the route
          # must be identical whether or not logging (hence the advisory) is on.
          r1=$(SDPA_BMAT_LOG=1 ./sdpa_dd -ds example1.dat-s -o /tmp/r1 -p param.sdpa 2>&1 \
                 | grep -ao -- "-> [A-Z]*" | head -1)
          ./sdpa_dd -ds example1.dat-s -o /tmp/r2 -p param.sdpa >/dev/null 2>&1
          diff <(grep -aE "^(objValPrimal|objValDual|phase.value)" /tmp/r1) \
               <(grep -aE "^(objValPrimal|objValDual|phase.value)" /tmp/r2) \
            || { echo "FAIL: turning the advisory on changed the answer" >&2; exit 1; }
          echo "  advisory does not change the route or the answer (route was $r1)"
      - name: route boundaries -- exact route under auto, fill and unset
        run: |
          set -e
          # FINDING L. The only route check this fork had compared example1's printed OUTPUT
          # between unset and `auto`. That cannot detect a silent promotion of `fill` to the
          # default: on a problem where both routes reach the same answer the output is
          # identical by construction. So assert the ROUTE, which SDPA_BMAT_LOG=1 prints.
          #
          # Expected routes are MEASURED and pinned, not derived: retuning a cutoff is allowed,
          # but it has to show up here as a failure rather than pass unnoticed.
          #
          # Since 2026-08-24 `auto` IS the fill policy and `legacy` is the old chooser, so the
          # divergent pair is legacy-vs-auto, not auto-vs-fill. `fill` must now equal `auto`
          # exactly -- it is a retained synonym, and a synonym that silently differs is worse
          # than no synonym.
          #
          # case    auto    fill    unset   legacy  what it pins
          # m100    DENSE   DENSE   DENSE   DENSE   gate 1 is `m > 100`, so m=100 must NOT pass
          # m101    SPARSE  SPARSE  SPARSE  SPARSE  and m=101 must
          # nb5     DENSE   DENSE   DENSE   DENSE   gate 1 is `nBlock > 5`, so 5 must NOT pass
          # nb6     SPARSE  SPARSE  SPARSE  SPARSE  and 6 must
          # wide    SPARSE  SPARSE  SPARSE  DENSE   POLICY-DIVERGENT: the case that matters
          # wider   DENSE   DENSE   DENSE   DENSE   gate 2 trips at half the constraints plus one
          # dense   DENSE   DENSE   DENSE   DENSE
          # band    DENSE   DENSE   DENSE   DENSE
          route() { # $1 fixture $2 mode-or-empty
            if [ -z "$2" ]; then
              SDPA_BMAT_LOG=1 ./sdpa_dd -ds "$1" -o /tmp/rf.out -p param.sdpa 2>&1
            else
              SDPA_BMAT_LOG=1 SDPA_BMAT_MODE="$2" ./sdpa_dd -ds "$1" -o /tmp/rf.out -p param.sdpa 2>&1
            fi | grep -ao -- "-> [A-Z]*" | head -1 | awk '{print $2}'
          }
          fails=0
          checked=0
          for spec in m100:DENSE:DENSE:DENSE:DENSE     m101:SPARSE:SPARSE:SPARSE:SPARSE \
                      nb5:DENSE:DENSE:DENSE:DENSE      nb6:SPARSE:SPARSE:SPARSE:SPARSE \
                      wide:SPARSE:SPARSE:SPARSE:DENSE  wider:DENSE:DENSE:DENSE:DENSE \
                      dense:DENSE:DENSE:DENSE:DENSE    band:DENSE:DENSE:DENSE:DENSE; do
            case=$(echo "$spec" | cut -d: -f1)
            exp_auto=$(echo "$spec" | cut -d: -f2)
            exp_fill=$(echo "$spec" | cut -d: -f3)
            exp_unset=$(echo "$spec" | cut -d: -f4)
            exp_legacy=$(echo "$spec" | cut -d: -f5)
            python3 tests/gen_route_fixture.py "$case" > /tmp/rf.dat-s
            a=$(route /tmp/rf.dat-s auto); f=$(route /tmp/rf.dat-s fill); u=$(route /tmp/rf.dat-s "")
            l=$(route /tmp/rf.dat-s legacy)
            checked=$((checked+1))
            printf "  %-6s auto=%-6s fill=%-6s unset=%-6s legacy=%-6s\n" "$case" "$a" "$f" "$u" "$l"
            [ -n "$a" ] && [ -n "$f" ] && [ -n "$u" ] && [ -n "$l" ] \
              || { echo "FAIL: $case produced no route line at all" >&2; fails=$((fails+1)); continue; }
            [ "$a" = "$exp_auto" ]  || { echo "FAIL: $case auto=$a expected $exp_auto" >&2;  fails=$((fails+1)); }
            [ "$f" = "$exp_fill" ]  || { echo "FAIL: $case fill=$f expected $exp_fill" >&2;  fails=$((fails+1)); }
            [ "$u" = "$exp_unset" ] || { echo "FAIL: $case unset=$u expected $exp_unset" >&2; fails=$((fails+1)); }
            [ "$l" = "$exp_legacy" ] || { echo "FAIL: $case legacy=$l expected $exp_legacy" >&2; fails=$((fails+1)); }
            # unset must follow auto, ALWAYS.
            [ "$u" = "$a" ] || { echo "FAIL: $case unset route $u != auto route $a" >&2; fails=$((fails+1)); }
            # and `fill` is a retained SYNONYM for auto -- one that silently differed would be
            # worse than not having it.
            [ "$f" = "$a" ] || { echo "FAIL: $case fill route $f != auto route $a; fill must be a synonym" >&2; fails=$((fails+1)); }
          done
          [ "$checked" -eq 8 ] || { echo "FAIL: only $checked of 8 cases ran" >&2; exit 1; }
          # NON-VACUITY: at least one case must actually diverge between the two POLICIES, or the
          # unset==auto assertion above is satisfied by every route table and proves nothing.
          # The divergent pair is legacy-vs-auto since the promotion; comparing auto with fill
          # would now compare a policy with itself and always pass.
          python3 tests/gen_route_fixture.py wide > /tmp/rf.dat-s
          da=$(route /tmp/rf.dat-s auto); dl=$(route /tmp/rf.dat-s legacy)
          [ "$da" != "$dl" ] \
            || { echo "FAIL: 'wide' no longer diverges (auto=$da legacy=$dl); the unset check is now vacuous" >&2; exit 1; }
          echo "  policy divergence present on 'wide': auto=$da legacy=$dl"
          [ "$fails" -eq 0 ] || { echo "$fails route assertion(s) failed" >&2; exit 1; }
      - name: cross-block assembly -- the race the block-diagonal fixture cannot catch
        run: |
          set -e
          # REGRESSION GUARD for the `nowait` data race fixed on 2026-08-23.
          #
          # The spchol fixture gives every constraint one block, so no Schur entry is ever
          # written from two blocks and the cross-block accumulation is never exercised. This
          # fixture makes each constraint span two ADJACENT blocks, which is what puts two
          # writers on one sparse_bMat slot with an overlap window wide enough to hit. On the
          # released v7.1.3-omp.2 binary it returned six different objectives in six runs; the
          # stride and the adjacency both matter, see the generator's header.
          #
          # It routes sparse and threads its assembly with NO environment variables set.
          python3 tests/gen_crossblock_fixture.py > xb.dat-s
          SDPA_BMAT_LOG=1 ./sdpa_dd -ds xb.dat-s -o /tmp/xb0 -p param.sdpa 2>&1 \
            | grep -a "bmat: " | head -1
          grep -aq "SPARSE" /tmp/xb0 || ./sdpa_dd -ds xb.dat-s -o /tmp/xb0 -p param.sdpa \
            2>&1 | grep -aq "SPARSE computation" \
            || { echo "FAIL: fixture no longer routes sparse; it cannot test the assembly" >&2; exit 1; }
          # 1. repeated runs at a FIXED thread count must agree. This is the property the bug
          #    broke, and thread-count comparison alone would NOT have caught it.
          rm -f /tmp/xb.objs
          for i in 1 2 3 4 5 6; do
            ./sdpa_dd -ds xb.dat-s -o /tmp/xb.$i -p param.sdpa >/dev/null 2>&1
            grep -a "^objValPrimal" /tmp/xb.$i >> /tmp/xb.objs
          done
          n=$(sort -u /tmp/xb.objs | wc -l)
          cat /tmp/xb.objs
          [ "$n" -eq 1 ] || { echo "FAIL: $n distinct objectives in 6 runs at one thread count" >&2; exit 1; }
          [ -s /tmp/xb.objs ] || { echo "FAIL: no objective produced; the fixture did not solve" >&2; exit 1; }
          echo "  6 runs, 1 distinct objective"
          # 2. and the assembly stream must match the serial assembly byte for byte.
          rm -f /tmp/xbp.bin /tmp/xbs.bin
          SDPA_BMAT_ASM_DUMP=/tmp/xbp.bin ./sdpa_dd -ds xb.dat-s -o /tmp/xb1 -p param.sdpa >/dev/null 2>&1
          SDPA_BMAT_ASM_MODE=serial SDPA_BMAT_ASM_DUMP=/tmp/xbs.bin \
            ./sdpa_dd -ds xb.dat-s -o /tmp/xb2 -p param.sdpa >/dev/null 2>&1
          sz=$(wc -c < /tmp/xbp.bin)
          [ "$sz" -gt 100000 ] || { echo "FAIL: assembly stream is only $sz bytes; the run did not get far enough to mean anything" >&2; exit 1; }
          cmp /tmp/xbp.bin /tmp/xbs.bin \
            || { echo "FAIL: threaded assembly differs from serial on the cross-block fixture" >&2; exit 1; }
          echo "  threaded assembly == serial, $sz bytes"
          # 3. and the overlap POLICY must be the computed one, in both directions. Without
          #    this the mechanism could silently degrade to "always barrier" (correct but slow)
          #    or -- far worse -- to "always nowait", and every assertion above would still pass
          #    on the fixtures that happen to be run.
          xbp=$(SDPA_BMAT_ASM_LOG=1 ./sdpa_dd -ds xb.dat-s -o /tmp/xb3 -p param.sdpa 2>&1 \
                  | grep -ao "overlap=[a-z]*" | head -1)
          [ "$xbp" = "overlap=barrier" ] \
            || { echo "FAIL: the cross-block fixture took $xbp; its blocks SHARE entries" >&2; exit 1; }
          python3 tests/gen_spchol_fixture.py > spchol_fix.dat-s
          sfp=$(SDPA_BMAT_MODE=sparse SDPA_BMAT_ASM_MODE=parallel SDPA_BMAT_ASM_LOG=1 \
                  ./sdpa_dd -ds spchol_fix.dat-s -o /tmp/sf3 -p param.sdpa 2>&1 \
                  | grep -ao "overlap=[a-z]*" | head -1)
          [ "$sfp" = "overlap=nowait" ] \
            || { echo "FAIL: the block-diagonal fixture took $sfp; its blocks are disjoint," >&2
                 echo "      so the fast path has been lost." >&2; exit 1; }
          echo "  overlap policy: cross-block fixture -> barrier, block-diagonal -> nowait"
      - name: the census, and the fixture that reaches the F2/dense-Aj path
        run: |
          set -e
          # Every real dd problem reports f2dense_total = 0 (no dense A_j anywhere), so this
          # branch is unreachable on the shipped problem set and needs a purpose-built fixture.
          python3 tests/gen_f2dense_fixture.py > f2d.dat-s
          SDPA_BMAT_MODE=sparse SDPA_BMAT_ASM_CENSUS=1 \
            ./sdpa_dd -ds f2d.dat-s -o /tmp/f2o -p param.sdpa -k 0.3 > /tmp/cen.log 2>&1 || true
          grep -a "^bmat census: TOTAL" /tmp/cen.log
          aft=$(sed -n 's/.*f2dense_after_first=\([0-9]*\).*/\1/p' /tmp/cen.log | head -1)
          [ "${aft:-0}" -ge 1 ] \
            || { echo "FAIL: the fixture reaches f2dense_after_first=0, so it exercises nothing" >&2
                 cat /tmp/cen.log; exit 1; }
          echo "  fixture reaches the consuming path: f2dense_after_first=$aft"
      - name: negative controls -- prove the new checks can fail
        run: |
          set -e
          make clean >/dev/null 2>&1 || true
          ./configure --enable-openmp=yes CXXFLAGS="-O2 -DSDPA_SPCHOL_TEST_HOOKS" >/dev/null
          make -j"$(nproc)" >/dev/null
          python3 tests/gen_f2dense_fixture.py > f2d.dat-s
          norm () { sed -e "/Time(sec)/,\$d" "$1" | grep -av -E "^(out|data|parameter) +is|total time|start at|end at"; }

          # (1) The hasF2Gcal path is CONSEQUENTIAL. -ftrivial-auto-var-init cannot show this:
          #     GCC pattern-init writes 0xFE to an unsigned char but ZERO to a bool, so both
          #     settings yield `false` and the harmful reading is `true`. Force it instead.
          SDPA_BMAT_MODE=sparse ./sdpa_dd -ds f2d.dat-s -o /tmp/n1 -p param.sdpa -k 0.3 >/dev/null 2>&1 || true
          SDPA_BMAT_TEST_F2_STALE=1 SDPA_BMAT_MODE=sparse \
            ./sdpa_dd -ds f2d.dat-s -o /tmp/n2 -p param.sdpa -k 0.3 >/dev/null 2>&1 || true
          if diff <(norm /tmp/n1) <(norm /tmp/n2) >/dev/null; then
            echo "FAIL: forcing the stale-G reading changed nothing -- the fixture does not reach" >&2
            echo "      a consequential path, so it is a vacuous test." >&2
            exit 1
          fi
          echo "  (1) stale-G injection changes the result: the guarded path matters"

          # (2) The fill>=aggregate invariant can actually fire. NOT on f2d.dat-s: that fixture
          #     is m=5, so it exits at gate 1 and ordering_bMat returns before the invariant is
          #     ever evaluated. The spchol fixture clears gate 1 and routes sparse.
          python3 tests/gen_spchol_fixture.py > spchol_fix.dat-s
          if SDPA_BMAT_TEST_BREAK_INVARIANT=1 SDPA_BMAT_MODE=fill \
               ./sdpa_dd -ds spchol_fix.dat-s -o /tmp/bi -p param.sdpa >/tmp/bl 2>&1; then
            echo "FAIL: the injected invariant violation did not stop the solve" >&2
            echo "      (does this fixture actually reach ordering_bMat's invariant?)" >&2
            exit 1
          fi
          grep -q "TEST INJECTION ACTIVE" /tmp/bl \
            || { echo "FAIL: invariant fired without naming the injection -- a lying diagnostic" >&2
                 cat /tmp/bl; exit 1; }
          echo "  (2) the fill-policy invariant fires, and says the value was injected"
          SDPA_BMAT_MODE=fill ./sdpa_dd -ds spchol_fix.dat-s -o /tmp/bi2 -p param.sdpa >/dev/null 2>&1
          echo "  (2b) and the same run without injection succeeds"

          # (3) The independent legacy arm agrees with the shared-kernel arms. serial and the
          #     threaded region both call spchol_k1, so only this can check that kernel.
          for m in legacy serial force; do
            rm -f /tmp/lg.$m
            SDPA_BMAT_MODE=sparse SDPA_SPCHOL_MODE=$m SDPA_SPCHOL_DIGEST_DUMP=/tmp/lg.$m \
              OMP_NUM_THREADS=4 ./sdpa_dd -ds spchol_fix.dat-s -o /tmp/lo.$m -p param.sdpa >/dev/null 2>&1
          done
          cmp /tmp/lg.legacy /tmp/lg.serial \
            || { echo "FAIL: the independent legacy arm disagrees with serial" >&2; exit 1; }
          cmp /tmp/lg.legacy /tmp/lg.force \
            || { echo "FAIL: the independent legacy arm disagrees with the threaded path" >&2; exit 1; }
          echo "  (3) legacy oracle agrees with serial and threaded, byte for byte"

          # (4) The ASSEMBLY oracle can reject. Both arms threaded, same build, so the only
          #     difference is the injected one-ulp change.
          for tag in clean mut; do
            ex=""; [ $tag = mut ] && ex="SDPA_BMAT_ASM_MUTATE=1"
            rm -f /tmp/am.$tag
            env $ex SDPA_BMAT_MODE=sparse SDPA_BMAT_ASM_MODE=parallel \
              SDPA_BMAT_ASM_DUMP=/tmp/am.$tag OMP_NUM_THREADS=4 \
              ./sdpa_dd -ds spchol_fix.dat-s -o /tmp/amo.$tag -p param.sdpa >/dev/null 2>&1
          done
          if cmp -s /tmp/am.clean /tmp/am.mut; then
            echo "FAIL: a one-ulp change to the assembled matrix did not change its stream." >&2
            echo "      The assembly oracle is BLIND, so the comparison above proves nothing." >&2
            exit 1
          fi
          echo "  (4) assembly oracle detects a one-ulp change"

          # (5) FINDING E, first half: the one-member-team FALLBACK. Inside the parallel region
          #     there is a branch for "num_threads(n) returned fewer than 2", which no input can
          #     reach on purpose -- the dispatcher's own `team < 2` test exits earlier and by a
          #     DIFFERENT path. SDPA_SPCHOL_TEAM_OVERRIDE=1 asks the runtime for one thread while
          #     leaving the gates' team intact, which is the only way in.
          python3 tests/gen_spchol_fixture.py > spchol_fix.dat-s
          SDPA_BMAT_MODE=sparse SDPA_SPCHOL_MODE=force SDPA_SPCHOL_LOG=1 \
            SDPA_SPCHOL_TEAM_OVERRIDE=1 \
            ./sdpa_dd -ds spchol_fix.dat-s -o /tmp/to.out -p param.sdpa > /tmp/to.log 2>&1
          grep -aq "received 1; ran serial" /tmp/to.log \
            || { echo "FAIL: TEAM_OVERRIDE=1 did not reach the one-member-team fallback" >&2
                 grep -a "spchol:" /tmp/to.log | head -3; exit 1; }
          #     and the fallback must produce the SAME factor, or it is a second implementation
          #     of the answer rather than a fallback.
          rm -f /tmp/fb.bin /tmp/fn.bin
          SDPA_BMAT_MODE=sparse SDPA_SPCHOL_MODE=force SDPA_SPCHOL_TEAM_OVERRIDE=1 \
            SDPA_SPCHOL_DIGEST_DUMP=/tmp/fb.bin \
            ./sdpa_dd -ds spchol_fix.dat-s -o /tmp/fb.out -p param.sdpa >/dev/null 2>&1
          SDPA_BMAT_MODE=sparse SDPA_SPCHOL_MODE=force SDPA_SPCHOL_DIGEST_DUMP=/tmp/fn.bin \
            ./sdpa_dd -ds spchol_fix.dat-s -o /tmp/fn.out -p param.sdpa >/dev/null 2>&1
          [ -s /tmp/fb.bin ] || { echo "FAIL: fallback produced no factor digest" >&2; exit 1; }
          cmp /tmp/fb.bin /tmp/fn.bin \
            || { echo "FAIL: the one-member-team fallback produced a different factor" >&2; exit 1; }
          echo "  (5) one-member-team fallback reached, and its factor is byte-identical"

          # (6) FINDING E, second half: failure RETURN from a partly-threaded factorisation.
          #     Declare a pivot indefinite well past the first parallel pivots, then require
          #     that threaded pivots really did run first, that the run reports failure, and
          #     that the diagnostic says the failure was DECLARED rather than measured.
          set +e
          SDPA_BMAT_MODE=sparse SDPA_SPCHOL_MODE=force SDPA_SPCHOL_LOG=1 \
            SDPA_SPCHOL_FAIL_AT=40 \
            ./sdpa_dd -ds spchol_fix.dat-s -o /tmp/fa.out -p param.sdpa > /tmp/fa.log 2>&1
          fst=$?
          set -e
          [ "$fst" -ne 0 ] \
            || { echo "FAIL: FAIL_AT=40 exited 0; the failure path did not propagate" >&2; exit 1; }
          thr=$(sed -n 's/.*pivots_threaded=\([0-9]*\).*/\1/p' /tmp/fa.log | head -1)
          [ "${thr:-0}" -ge 1 ] \
            || { echo "FAIL: failure fired before any pivot ran threaded (pivots_threaded=${thr:-0})," >&2
                 echo "      so this does not test failure from a partly-threaded factor." >&2; exit 1; }
          grep -aq "DECLARED by SDPA_SPCHOL_FAIL_AT" /tmp/fa.log \
            || { echo "FAIL: the diagnostic does not say the failure was injected" >&2; exit 1; }
          echo "  (6) failure returns from a partly-threaded factor after $thr threaded pivots"

          # (7) and a RELEASE build must refuse both hooks rather than ignore them, or a script
          #     that sets one and sees a normal run would conclude the branch was covered.
          make clean >/dev/null 2>&1 || true
          ./configure --enable-openmp=yes >/dev/null
          make -j"$(nproc)" >/dev/null
          for h in SDPA_SPCHOL_TEAM_OVERRIDE=1 SDPA_SPCHOL_FAIL_AT=3; do
            set +e
            env $h ./sdpa_dd -ds example1.dat-s -o /tmp/nx.out -p param.sdpa > /tmp/nx 2>&1
            st=$?
            set -e
            [ "$st" -ne 0 ] || { echo "FAIL: release build accepted $h" >&2; cat /tmp/nx; exit 1; }
            grep -aq "was not built with" /tmp/nx \
              || { echo "FAIL: $h refused with the wrong diagnostic" >&2; cat /tmp/nx; exit 1; }
          done
          echo "  (7) release build refuses both finding-E hooks"

          # Already a release build after (7); nothing further to restore.
      - name: threaded bMat assembly -- identical matrix, and really threaded
        run: |
          set -e
          python3 tests/gen_spchol_fixture.py > spchol_fix.dat-s
          # Forced both ways so the comparison is like-for-like, and the assembly's OWN stream
          # is what is compared -- not the factor's. The factor is computed FROM the assembled
          # matrix, so a Cholesky insensitive to a small assembly error would mask it.
          rm -f /tmp/asm.*
          for am in serial parallel; do
            SDPA_BMAT_MODE=sparse SDPA_BMAT_ASM_MODE=$am SDPA_BMAT_ASM_DUMP=/tmp/asm.$am \
              SDPA_BMAT_ASM_LOG=1 OMP_NUM_THREADS=4 \
              ./sdpa_dd -ds spchol_fix.dat-s -o /tmp/ao.$am -p param.sdpa > /tmp/al.$am 2>&1
            [ -s /tmp/asm.$am ] || { echo "FAIL: no assembly stream for mode=$am" >&2; exit 1; }
          done
          cmp /tmp/asm.serial /tmp/asm.parallel \
            || { echo "FAIL: the threaded assembly built a DIFFERENT matrix" >&2; exit 1; }
          echo "  assembly byte-identical serial vs parallel ($(wc -c < /tmp/asm.serial) bytes)"
          # Non-vacuity: it must actually have threaded, and executed every group.
          grep -aoE "bmat asm: team=[0-9]+ groups=[0-9]+ groups_executed=[0-9]+" /tmp/al.parallel | head -1
          t=$(sed -n 's/.*bmat asm: team=\([0-9]*\).*/\1/p' /tmp/al.parallel | head -1)
          g=$(sed -n 's/.*groups=\([0-9]*\) .*/\1/p'         /tmp/al.parallel | head -1)
          e=$(sed -n 's/.*groups_executed=\([0-9]*\).*/\1/p'  /tmp/al.parallel | head -1)
          [ "${t:-0}" -ge 2 ] \
            || { echo "FAIL: assembly ran with team=${t:-0} -- this comparison is vacuous" >&2; exit 1; }
          [ "${e:-0}" = "${g:-1}" ] \
            || { echo "FAIL: ${e:-0} of ${g:-?} groups executed -- work was dropped" >&2; exit 1; }
          echo "  team=$t, all $e groups executed"
          # Across thread counts too.
          for th in 1 2 4; do
            rm -f /tmp/at.$th
            SDPA_BMAT_MODE=sparse SDPA_BMAT_ASM_MODE=parallel SDPA_BMAT_ASM_DUMP=/tmp/at.$th \
              OMP_NUM_THREADS=$th ./sdpa_dd -ds spchol_fix.dat-s -o /tmp/ai.$th -p param.sdpa >/dev/null 2>&1
          done
          for th in 2 4; do
            cmp /tmp/at.1 /tmp/at.$th \
              || { echo "FAIL: assembly differs between 1 and $th threads" >&2; exit 1; }
          done
          echo "  assembly byte-identical across 1/2/4 threads"
      - name: a forced mode forces or fails, never downgrades
        run: |
          set -e
          make clean >/dev/null 2>&1 || true
          ./configure --enable-openmp=no >/dev/null
          make -j"$(nproc)" >/dev/null
          if SDPA_SPCHOL_MODE=force ./sdpa_dd -ds example1.dat-s -o /tmp/f -p param.sdpa >/tmp/fl 2>&1; then
            echo "FAIL: force was accepted by a build without OpenMP -- a benchmark that believed" >&2
            echo "      it measured the threaded path would have measured the serial one." >&2
            exit 1
          fi
          grep -q "built without OpenMP" /tmp/fl \
            || { echo "FAIL: refused with the wrong diagnostic" >&2; cat /tmp/fl; exit 1; }
          echo "  force refused in a serial build"
          for m in auto serial; do
            SDPA_SPCHOL_MODE=$m ./sdpa_dd -ds example1.dat-s -o /tmp/f -p param.sdpa >/dev/null 2>&1 \
              || { echo "FAIL: $m must still work in a serial build" >&2; exit 1; }
            echo "  $m still takes the serial path"
          done
          make clean >/dev/null 2>&1 || true
          ./configure --enable-openmp=yes >/dev/null
          make -j"$(nproc)" >/dev/null
      - name: unset and an explicit auto must select the same policy
        run: |
          set -e
          # Exactly what it says, and no more. It does NOT assert that auto is the released
          # expression -- that stopped being true when the fill-derived policy became the default
          # on 2026-08-24, and the step's old name ("auto must be unchanged by the mode switch")
          # claimed otherwise. The routes themselves are pinned by the route-boundary battery,
          # which compares `legacy` against `auto` on a divergent fixture.
          ./sdpa_dd -ds example1.dat-s -o /tmp/u -p param.sdpa >/dev/null 2>&1
          SDPA_BMAT_MODE=auto ./sdpa_dd -ds example1.dat-s -o /tmp/a -p param.sdpa >/dev/null 2>&1
          diff <(grep -aE "objValPrimal|objValDual|Iteration|phase" /tmp/u) \
               <(grep -aE "objValPrimal|objValDual|Iteration|phase" /tmp/a) \
            || { echo "FAIL: unset and auto disagree" >&2; exit 1; }
          echo "  unset == auto"
